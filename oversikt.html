<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Samnanger G14 | Coach</title>
  <link rel="stylesheet" href="oversikt.css?v=20260920-livehero1" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#08111f" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Coach" />
  <link rel="apple-touch-icon" href="icon-192.png" />
</head>
<body>
  <main class="appShell">
    <header class="appHeader">
      <div class="brandBlock">
        <div class="brandMark">S</div>
        <div>
          <p class="eyebrow">SAMNANGER IL</p>
          <h1>G14</h1>
          <span id="userLine" class="userLine"></span>
        </div>
      </div>
      <div class="headerActions">
        <button id="coachOnlyBtn" class="roundBtn" type="button" hidden aria-label="Dashboard">⌂</button>
        <button id="logoutBtn" class="roundBtn" type="button" aria-label="Logg ut">↗</button>
      </div>
    </header>

    <section class="heroCard" aria-labelledby="nextOpponent">
      <div class="heroTopline">
        <span class="sectionLabel">NESTE KAMP</span>
        <span id="nextCountdown" class="countdown"></span>
      </div>
      <div class="heroContent">
        <h2 id="nextOpponent">Laster kamp…</h2>
        <p id="nextMeta" class="heroMeta">Henter kampinformasjon</p>
        <p id="nextVenue" class="heroVenue"></p>
      </div>
      <div class="heroActions">
        <button id="lineupBtn" class="actionBtn actionSecondary" type="button">
          <span class="actionIcon">⌗</span>
          <span><strong>Lagoppstilling</strong><small>Sett laget på banen</small></span>
        </button>
        <button id="startMatchBtn" class="actionBtn actionPrimary" type="button">
          <span class="actionIcon">▶</span>
          <span><strong>Start kamp</strong><small>Åpne kampregistrering</small></span>
        </button>
      </div>
    </section>

    <nav class="mainNav" aria-label="Hovedmeny">
      <button id="allMatchesBtn" class="navCard navUpcoming" type="button">
        <span class="navIcon">▤</span>
        <span><strong>Kampoversikt</strong><small>Resultater og kamper</small></span>
        <b>›</b>
      </button>
      <button id="allPlayedBtn" class="navCard navPlayed" type="button">
        <span class="navIcon">✓</span>
        <span><strong>Spilte</strong><small>Resultater og hendelser</small></span>
        <b>›</b>
      </button>
      <button id="statsBtn" class="navCard navStats" type="button">
        <span class="navIcon">▥</span>
        <span><strong>Statistikk</strong><small>Mål og spilletid</small></span>
        <b>›</b>
      </button>
      <a class="navCard navTable" href="https://www.fotball.no/fotballdata/lag/hjem/?fiksId=170874&underside=tabeller" target="_blank" rel="noopener noreferrer">
        <span class="navIcon">#</span>
        <span><strong>Tabell</strong><small>MinFotball</small></span>
        <b>↗</b>
      </a>
    </nav>

    <section class="contentSection upcomingSection">
      <div class="sectionHeading">
        <div>
          <span class="sectionLabel">FREMOVER</span>
          <h2>Kommende kamper</h2>
        </div>
      </div>
      <div id="upcomingList" class="matchList">
        <div class="skeletonRow"></div>
        <div class="skeletonRow"></div>
      </div>
    </section>

    <section class="contentSection resultSection lastSection">
      <div class="sectionHeading">
        <div>
          <span class="sectionLabel">SIST SPILT</span>
          <h2>Siste resultat</h2>
        </div>
      </div>
      <div id="lastMatch"><div class="skeletonCard"></div></div>
    </section>

    <p id="errorMsg" class="error"></p>
  </main>
  <script type="module" src="oversikt-home.js?v=20260920-livehero1"></script>
  <script type="module" src="kamper-time-consistency.js?v=20260916-2"></script>
</body>
</html>
