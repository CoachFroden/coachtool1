<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Kamper · Coach</title>
  <link rel="stylesheet" href="kamper.css?v=20260920-delete1" />
  <link rel="stylesheet" href="lineup-ui.css?v=20260920-lineupfix4" />
  <meta name="theme-color" content="#07111d" />
</head>

<body>
  <header class="pageHeader">
    <button class="back-btn" type="button" onclick="goBack()" aria-label="Gå tilbake">←</button>
    <div class="headerText">
      <span class="eyebrow">SAMNANGER G14</span>
      <h1>Kamper</h1>
      <p>Neste kamp og kommende kampplan</p>
    </div>
    <div class="headerActions"><button id="newMatchBtn" class="newMatchBtn" type="button">+ Ny kamp</button><a class="overviewLink" href="oversikt.html">Oversikt</a></div>
  </header>

  <main class="pageShell">
    <section class="nextSection" aria-labelledby="nextHeading">
      <div class="sectionHeader">
        <div>
          <span class="sectionKicker">KOMMENDE</span>
          <h2 id="nextHeading">Neste kamp</h2>
        </div>
      </div>

      <div id="nextMatch" class="nextMatchSlot" aria-live="polite">
        <div class="loadingCard">
          <span class="loadingBall">⚽</span>
          <span>Laster neste kamp…</span>
        </div>
      </div>
    </section>

    <section class="matchesSection" aria-labelledby="laterHeading">
      <div class="sectionHeader">
        <div>
          <span class="sectionKicker">KAMPPLAN</span>
          <h2 id="laterHeading">Senere kamper</h2>
        </div>
        <span id="matchCount" class="matchCount">Laster…</span>
      </div>

      <div id="matchGrid"></div>
    </section>
  </main>

  <div id="pitchModalOverlay" class="modal-overlay">
    <section class="modal modal-large" role="dialog" aria-modal="true" aria-labelledby="pitchModalTitle">
      <div class="modal-header">
        <div>
          <span class="modalKicker">LAGOPPSTILLING</span>
          <h2 id="pitchModalTitle"></h2>
        </div>
        <button id="closePitchModal" class="close" type="button" aria-label="Lukk">&times;</button>
      </div>

      <div class="modal-content">
        <div class="match-info">
          <div class="match-date" id="pitchModalDate"></div>
          <div class="match-row">
            <span class="label">Sted</span>
            <span id="pitchModalVenue"></span>
          </div>
          <div class="match-row">
            <span class="label">Type</span>
            <span id="pitchModalType"></span>
          </div>
        </div>

        <div class="lineup-header">
          <div class="lineup-title">Lagoppstilling</div>
          <div id="formationDisplay" class="formation">4-3-3</div>
        </div>

        <div id="pitch" class="pitch">
          <div class="box box-top"></div>
          <div class="goal-area goal-top"></div>
          <div class="goal goal-top"></div>
          <div class="penalty penalty-top"></div>

          <div class="box box-bottom"></div>
          <div class="goal-area goal-bottom"></div>
          <div class="goal goal-bottom"></div>
          <div class="penalty penalty-bottom"></div>
        </div>

        <button id="removePlayerBtn" type="button">Fjern valgt spiller</button>

        <div class="loan-player-box">
          <input id="loanPlayerInput" type="text" placeholder="Navn på lånespiller" />
          <button id="addLoanPlayerBtn" type="button">Legg til</button>
        </div>

        <div id="playerList"></div>
      </div>
    </section>
  </div>

  <div id="infoModalOverlay" class="modal-overlay">
    <section class="modal modal-small" role="dialog" aria-modal="true" aria-labelledby="infoModalTitle">
      <div class="modal-header">
        <div>
          <span class="modalKicker">KAMPDETALJER</span>
          <h3 id="infoModalTitle"></h3>
        </div>
        <button id="closeInfoModal" class="close" type="button" aria-label="Lukk">&times;</button>
      </div>

      <div class="modal-content">
        <div class="match-info">
          <div class="match-date" id="infoModalDate"></div>
          <div class="match-row">
            <span class="label">Sted</span>
            <span id="infoModalVenue"></span>
          </div>
          <div class="match-row">
            <span class="label">Type</span>
            <span id="infoModalType"></span>
          </div>
        </div>
        <div class="infoMatchActions">
          <button id="deleteMatchBtn" class="deleteMatchBtn" type="button">Slett kamp</button>
        </div>
      </div>
    </section>
  </div>

  <div id="newMatchOverlay" class="modal-overlay newMatchOverlay">
    <section class="modal modal-small newMatchModal" role="dialog" aria-modal="true" aria-labelledby="newMatchTitle">
      <div class="modal-header"><div><span class="modalKicker">KAMPPLAN</span><h2 id="newMatchTitle">Ny kamp</h2></div><button id="closeNewMatch" class="close" type="button" aria-label="Lukk">&times;</button></div>
      <form id="newMatchForm" class="newMatchForm">
        <label>Motstander<input id="newMatchOpponent" required autocomplete="off" placeholder="F.eks. Austevoll 2"></label>
        <div class="formRow"><label>Dato<input id="newMatchDate" type="date" required></label><label>Tid<input id="newMatchTime" type="time" required></label></div>
        <div class="formRow"><label>Hjemme / borte<select id="newMatchVenueType"><option value="home">Hjemmekamp</option><option value="away">Bortekamp</option></select></label><label>Kamp-type<select id="newMatchType"><option value="Seriekamp">Seriekamp</option><option value="Cupkamp">Cupkamp</option><option value="Treningskamp">Treningskamp</option></select></label></div>
        <label>Sted / bane<input id="newMatchVenue" autocomplete="off" placeholder="F.eks. Hagabotnane"></label>
        <div class="newMatchActions"><button id="cancelNewMatch" type="button" class="secondary">Avbryt</button><button id="saveNewMatch" type="submit" class="primary">Opprett kamp</button></div>
      </form>
    </section>
  </div>

  <script type="module">
    import { auth } from "./firebase-refleksjon.js";
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-auth.js";

    let stopAuthObserver = () => {};
    const user = await new Promise((resolve) => {
      stopAuthObserver = onAuthStateChanged(auth, (currentUser) => {
        stopAuthObserver();
        resolve(currentUser);
      });
    });

    if (!user) {
      window.location.href = "index.html";
    } else {
      await import("./kamper.js?v=20260920-endedfilter1");
      await import("./lineup-ui.js?v=20260920-lineupfix4");
      await import("./match-admin-links.js?v=20260913-1");
      await import("./kamper-time-consistency.js?v=20260916-2");
    }
  </script>
</body>
</html>
<!-- vercel-trigger-20260920 -->
