<!doctype html><html lang="no"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Spillerbrukere · Coach</title><link rel="stylesheet" href="coach.css"><link rel="stylesheet" href="spillerbrukere.css?v=20260925-compacthub1"></head><body><main class="dashboardShell"><header class="dashboardHeader"><div><p class="eyebrow">SAMNANGER G14</p><h1>Spillerbrukere</h1><p class="userLine">Godkjenning og oppfølging</p></div><a class="logoutButton back" href="fremside.html">← Tilbake</a></header><button id="pendingToggle" class="pendingToggle" type="button" hidden><span id="pendingBadge" class="pendingBadge">0</span><span><strong>Venter på godkjenning</strong><small>Trykk for å se kontoene</small></span><b aria-hidden="true">⌄</b></button><section id="pendingSection" class="pendingSection" hidden><div id="pendingList" class="adminList"></div></section><section class="block playerBlock"><div class="sectionHeading"><div><span class="sectionKicker">SPILLERPORTAL</span><h2>Spillere</h2><p class="sectionIntro">Trykk på en spiller for konto, samtaler og foresatte.</p></div></div><div id="playerHub" class="playerHub"><p class="empty">Laster…</p></div></section></main><div id="guardianRemoveModal" class="guardianRemoveModal" aria-hidden="true"><div class="guardianRemoveDialog" role="dialog" aria-modal="true" aria-labelledby="guardianRemoveTitle"><div class="guardianRemoveIcon">🗑</div><div><h3 id="guardianRemoveTitle">Slette foresatt?</h3><p id="guardianRemoveText"></p><div class="guardianRemoveActions"><button id="guardianRemoveCancel" type="button">Avbryt</button><button id="guardianRemoveConfirm" type="button" class="danger">Slett foresatt</button></div></div></div></div><div id="communicationModal" class="communicationModal" hidden><section class="communicationSheet"><div class="communicationHeader"><div><p class="sectionKicker">SPILLERDIALOG</p><h2 id="communicationTitle">Kommunikasjon</h2><p id="communicationSub"></p></div><button id="closeCommunication" class="closeCommunication" aria-label="Lukk">×</button></div><div id="communicationBody" class="communicationBody"></div><div class="communicationActions"><button id="shareCommunication" class="shareCommunication">Send samtale</button><button id="printCommunication" class="printCommunication">Skriv ut / lag PDF</button><button id="closeCommunicationBottom" class="secondaryClose">Lukk</button></div></section></div><div id="newConversationModal" class="composeModal">
