<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Coach | Statistikk</title>
  <link rel="stylesheet" href="statistikk.css?v=20260830-2" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#07111f" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Coach" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <style>
    .matchPickerWrap{display:flex;justify-content:flex-end;margin-top:12px}
    .matchPicker{max-width:100%;padding:10px 13px;border:1px solid rgba(96,165,250,.24);border-radius:13px;background:#0d1b2d;color:#dce7f3;font:inherit;font-size:11px;font-weight:750}
    @media(max-width:390px){.matchPicker{width:100%}}
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <button id="backBtn" class="iconBtn" type="button" aria-label="Tilbake">‹</button>
      <div class="titleBlock"><p class="kicker">SAMNANGER G14</p><h1>Statistikk</h1></div>
      <button id="logoutBtn" class="iconBtn" type="button" aria-label="Logg ut">↗</button>
    </header>

    <section id="summary" class="summaryGrid" aria-live="polite">
      <div class="summaryCard"><span>Kamper</span><strong>–</strong></div>
      <div class="summaryCard"><span>Seier</span><strong>–</strong></div>
      <div class="summaryCard"><span>Uavgjort</span><strong>–</strong></div>
      <div class="summaryCard"><span>Tap</span><strong>–</strong></div>
    </section>

    <section class="goalCard"><span>Målforskjell</span><strong id="goalSummary">–</strong></section>

    <div class="matchPickerWrap">
      <select id="matchSelect" class="matchPicker" aria-label="Velg kamp">
        <option value="">Velg kamp</option>
      </select>
    </div>

    <section class="statsSection">
      <div class="sectionHead"><span>SPILLERE</span><h2 id="statsTitle">Sesongstatistikk</h2></div>
      <div class="statsHeader"><span>Spiller</span><span>K</span><span>Min</span><span>Mål</span><span>G</span><span>R</span></div>
      <div id="playerStats"><div class="skeleton"></div></div>
    </section>

    <p id="errorMsg" class="error"></p>
  </main>
  <script type="module" src="statistikk.js?v=20260920-2"></script>
</body>
</html>
